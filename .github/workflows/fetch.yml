name: Fetch NQ bars

on:
  schedule:
    # 23:30 UTC Mon-Fri = 19:30 ET (EDT) / 18:30 ET (EST), after the 17:00 ET close
    - cron: "30 23 * * 1-5"
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch bars
        run: python fetch_nq.py

      - name: Commit data
        run: |
          git config user.name "nq-bot"
          git config user.email "nq-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "NQ bars $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
